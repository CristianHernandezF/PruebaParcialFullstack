<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="scriptLogin.js" defer></script>
    <title>Ingresar Usuario - Tienda DecoHogar</title>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <header class="bg-body-tertiary border-bottom py-3">
        <div class="container-fluid px-4">
            <div class="row align-items-center">
                <div class="col-4 text-start">
                    <a href="#" class="text-dark text-decoration-none fw-bold">HOME</a>
                </div>
                <div class="col-4 text-center">
                    <h1 class="h3 m-0 fw-bold tracking-wide">Tienda DecoHogar</h1>
                </div>
                <div class="col-4 text-end">
                    <a href="registro.html" class="btn btn-dark text-uppercase px-3 fw-bold">REGISTRARSE</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center my-5">
        <div class="card border-dark shadow-sm" style="width: 100%; max-width: 450px;">
            <div class="card-header bg-secondary-subtle border-bottom border-dark text-center py-2">
                <span class="fw-bold text-lowercase fs-6">inicio de sesión</span>
            </div>
            
            <div class="card-body p-4">
                <div id="mensajeLogin"></div>

                <form id="formLogin">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold text-uppercase small">CORREO</label>
                        <input type="email" class="form-control border-dark" id="email" name="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="contraseña" class="form-label fw-bold text-uppercase small">CONTRASEÑA</label>
                        <input type="password" class="form-control border-dark" id="contraseña" name="contraseña" required>
                    </div>

                    <div class="d-grid gap-2 text-center">
                        <button type="submit" class="btn btn-outline-dark px-4 py-2 border-2 fw-bold text-uppercase">Iniciar sesión</button>
                    </div>
                    
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
